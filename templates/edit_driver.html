<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Driver</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 430px;
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2a5298;
        }

        .update-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2a5298;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-btn:hover {
            background: #1e3c72;
        }

        .cancel-btn {
            display: block;

            width: 100%;

            text-align: center;

            margin-top: 12px;

            padding: 12px;

            border-radius: 8px;

            background: #eeeeee;

            color: #333;

            text-decoration: none;

            font-weight: bold;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>✏️ Edit Driver</h1>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>Driver Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ driver['name'] }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ driver['phone'] }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ driver['email'] }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    value="{{ driver['password'] }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Vehicle Number</label>

                <input
                    type="text"
                    name="vehicle_number"
                    value="{{ driver['vehicle_number'] }}"
                    required
                >

            </div>

            <button
                type="submit"
                class="update-btn"
            >
                💾 Save Changes
            </button>

        </form>

        <a
            href="{{ url_for('admin_dashboard') }}"
            class="cancel-btn"
        >
            ← Cancel
        </a>

    </div>

</body>

</html>
